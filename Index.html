<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Branded · Game Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root{
  --accent:#c9a227;
  --bg:#0e0d0b;
  --bg2:#13110d;
  --panel:#1a1711;
  --panel2:#211d15;
  --line:#2e2818;
  --line2:#3a3220;
  --ink:#e9dfc6;
  --ink2:#cabf9f;
  --mut:#8a7f63;
  --spell:#d2a531;
  --mon:#86abc2;
  --ext:#cc6049;
  --shadow:0 18px 50px -24px rgba(0,0,0,.85);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:96px}
body{
  background:
    radial-gradient(120% 80% at 50% -10%, #1c1810 0%, var(--bg) 55%) fixed,
    var(--bg);
  color:var(--ink2);
  font-family:"EB Garamond",Georgia,serif;
  font-size:18px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
#root{max-width:1180px;margin:0 auto;padding:0 28px 80px}
a{color:inherit;text-decoration:none}
strong{color:var(--ink);font-weight:600}
em{font-style:italic;color:var(--ink)}

/* ── Masthead ─────────────────────────────────────────── */
.masthead{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;gap:28px;
  padding:18px 4px;margin:0 -4px 4px;
  background:linear-gradient(180deg,var(--bg) 60%,rgba(14,13,11,.86));
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.masthead__brand{display:flex;align-items:center;gap:14px}
.masthead__mark{
  font-size:30px;color:var(--accent);line-height:1;
  text-shadow:0 0 22px color-mix(in oklab,var(--accent),transparent 55%);
}
.masthead__title{
  font-family:"Cinzel",serif;font-weight:700;font-size:23px;letter-spacing:.10em;
  color:var(--ink);text-transform:uppercase;
}
.masthead__sub{font-size:13px;color:var(--mut);letter-spacing:.04em;margin-top:2px}
.masthead__nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:560px}
.navlink{
  display:inline-flex;align-items:center;gap:7px;
  font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.02em;
  color:var(--mut);padding:5px 9px;border:1px solid transparent;border-radius:3px;
  transition:.18s;white-space:nowrap;
}
.navlink:hover{color:var(--ink);border-color:var(--line2);background:var(--panel)}
.navlink__c{
  font-weight:700;color:var(--accent);
  border:1px solid color-mix(in oklab,var(--accent),transparent 65%);
  border-radius:2px;padding:0 4px;font-size:9.5px;
}

/* ── Synopsis ─────────────────────────────────────────── */
.synopsis{padding:54px 0 40px;max-width:820px}
.synopsis__kicker,.codex__kicker,.endboard__kicker,.combo__initiator-lbl,.pieces__lbl{
  font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.28em;
  text-transform:uppercase;color:var(--accent);
}
.synopsis__lead{font-size:27px;line-height:1.4;color:var(--ink);margin:16px 0 14px;text-wrap:pretty}
.synopsis__lead strong{color:var(--accent);font-weight:600}
.synopsis__body{font-size:18.5px;color:var(--ink2);text-wrap:pretty}
.synopsis__legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.lg{
  font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.04em;
  padding:5px 11px;border-radius:3px;border:1px solid var(--line2);
  display:inline-flex;align-items:center;gap:7px;color:var(--ink2);
}
.lg::before{content:"";width:8px;height:8px;border-radius:50%}
.lg.type-spell::before{background:var(--spell)}
.lg.type-mon::before{background:var(--mon)}
.lg.type-ext::before{background:var(--ext)}

/* ── Codex ────────────────────────────────────────────── */
.codex{padding:18px 0 10px}
.codex__head{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.codex__hint{font-size:14.5px;color:var(--mut);font-style:italic}
.codex__grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:12px;
}

/* ── Card tile ────────────────────────────────────────── */
.ctile{
  background:var(--panel);border:1px solid var(--line);border-radius:6px;
  overflow:hidden;cursor:pointer;transition:.18s;position:relative;
  display:flex;flex-direction:column;
}
.ctile:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:var(--shadow)}
.ctile.drag{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in oklab,var(--accent),transparent 60%)}
.ctile__art{
  aspect-ratio:59/86;background-size:cover;background-position:center;
  background-color:var(--bg2);position:relative;
  border-bottom:1px solid var(--line);
}
.ctile__ph{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:5px;
  background:repeating-linear-gradient(135deg,transparent 0 7px,rgba(255,255,255,.018) 7px 14px);
}
.ctile__ph-mark{font-size:22px;color:var(--line2);line-height:1}
.ctile__ph-txt{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.1em;color:var(--mut);text-transform:uppercase}
.ctile__clear{
  position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;
  border:none;background:rgba(10,9,7,.78);color:var(--ink);cursor:pointer;
  font-size:14px;line-height:1;opacity:0;transition:.15s;
}
.ctile:hover .ctile__clear{opacity:1}
.ctile__label{padding:7px 9px 8px;display:flex;flex-direction:column;gap:2px}
.ctile__role{
  font-family:"JetBrains Mono",monospace;font-size:8.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mut);
}
.ctile__name{font-size:14px;line-height:1.2;color:var(--ink);font-weight:500}
.ctile{border-top:2px solid var(--line)}
.ctile.type-spell{border-top-color:var(--spell)}
.ctile.type-mon{border-top-color:var(--mon)}
.ctile.type-ext{border-top-color:var(--ext)}
/* chip-mode tile */
.ctile--chip{aspect-ratio:auto;padding:11px 12px;justify-content:center;cursor:default}
.ctile--chip:hover{transform:none}

/* ── Tier groups ──────────────────────────────────────── */
.tiergroup{margin-top:30px}
.tiergroup__head{display:flex;align-items:center;gap:18px;margin:46px 0 6px}
.tiergroup__line{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line2),transparent)}
.tiergroup__title{
  font-family:"Cinzel",serif;font-weight:600;font-size:15px;letter-spacing:.32em;
  text-transform:uppercase;color:var(--accent);white-space:nowrap;
}

/* ── Combo ────────────────────────────────────────────── */
.combo{
  background:linear-gradient(180deg,var(--panel),var(--bg2));
  border:1px solid var(--line);border-radius:10px;
  padding:26px 28px 28px;margin-top:20px;box-shadow:var(--shadow);
  position:relative;overflow:hidden;
}
.combo::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--accent),transparent 70%);opacity:.55;
}
.combo__bar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.combo__tier{
  font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;padding:4px 9px;border-radius:3px;
  background:color-mix(in oklab,var(--accent),transparent 88%);
  border:1px solid color-mix(in oklab,var(--accent),transparent 70%);color:var(--accent);
}
.combo__cardcount{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--mut);letter-spacing:.04em}
.combo__head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.combo__title{font-family:"Cinzel",serif;font-weight:600;font-size:27px;color:var(--ink);letter-spacing:.01em}
.combo__sub{font-size:15px;color:var(--mut);font-style:italic}
.combo__blurb{font-size:17.5px;color:var(--ink2);margin:10px 0 18px;max-width:760px;text-wrap:pretty}

.combo__initiator{display:flex;align-items:center;gap:12px;margin-bottom:20px}

.combo__grid{display:grid;grid-template-columns:1fr 340px;gap:26px;align-items:start}

/* ── Phases ───────────────────────────────────────────── */
.phase{margin-bottom:20px}
.phase:last-of-type{margin-bottom:0}
.phase__head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.phase__tag{
  font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:700;letter-spacing:.08em;
  width:26px;height:22px;display:grid;place-items:center;border-radius:3px;
}
.phase--main .phase__tag{color:var(--accent);background:color-mix(in oklab,var(--accent),transparent 88%);border:1px solid color-mix(in oklab,var(--accent),transparent 62%)}
.phase--end .phase__tag{color:var(--mon);background:color-mix(in oklab,var(--mon),transparent 88%);border:1px solid color-mix(in oklab,var(--mon),transparent 60%)}
.phase__lbl{
  font-family:"Cinzel",serif;font-weight:600;font-size:13.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink);
}
.phase__rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}

/* ── Phase rows (steps beside that phase's board) ─────── */
.prow{margin-top:26px}
.prow__head{display:flex;align-items:center;gap:11px;margin-bottom:16px}
.prow__lbl{font-family:"Cinzel",serif;font-weight:600;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
.prow__count{display:inline-flex;align-items:baseline;gap:6px;margin-left:2px}
.prow__count b{font-family:"Cinzel",serif;font-weight:700;font-size:21px;color:var(--accent);line-height:1;text-shadow:0 0 18px color-mix(in oklab,var(--accent),transparent 60%)}
.prow__count em{font-style:normal;font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.prow__rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.prow__grid{display:grid;grid-template-columns:minmax(0,1fr) 540px;gap:28px;align-items:start}
.pmat .mat{max-width:none;margin:0}
.prow__boardcap{
  display:block;text-align:center;margin-bottom:9px;
  font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--mut);
}
.dislist{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line2)}
.dislist__lbl{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:11px}

/* ── How to use the disruptions ───────────────────────── */
.usage{
  margin-top:24px;padding:20px 22px 22px;border-radius:10px;
  background:linear-gradient(180deg,var(--panel2),var(--bg2));
  border:1px solid var(--line2);box-shadow:var(--shadow);
}
.usage__head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.usage__kicker{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
.usage__sub{font-size:13.5px;color:var(--mut);font-style:italic}
.usage__list{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 26px}
.usage__item{display:flex;flex-direction:column;gap:7px}
.usage__top{display:flex;align-items:center;gap:9px}
.usage__glyph{
  flex:none;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;
  font-size:14px;border:1px solid var(--line2);background:var(--bg2);color:var(--ink);
}
.usage__glyph.k-negate,.usage__glyph.k-ssnegate{color:var(--mon);border-color:color-mix(in oklab,var(--mon),transparent 55%)}
.usage__glyph.k-banish,.usage__glyph.k-removal{color:var(--ext);border-color:color-mix(in oklab,var(--ext),transparent 55%)}
.usage__glyph.k-fusion,.usage__glyph.k-boss,.usage__glyph.k-revival{color:var(--accent);border-color:color-mix(in oklab,var(--accent),transparent 55%)}
.usage__glyph.k-setup{color:var(--mut)}
.usage__card{font-family:"Cinzel",serif;font-weight:600;font-size:15px;line-height:1.1}
.usage__card.type-spell{color:#eccf7e}
.usage__card.type-mon{color:#bcd6e6}
.usage__card.type-ext{color:#e9a08f}
.usage__kind{
  margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:8.5px;letter-spacing:.12em;
  color:var(--mut);border:1px solid var(--line2);border-radius:3px;padding:2px 6px;
}
.usage__txt{font-size:15.5px;line-height:1.5;color:var(--ink2);text-wrap:pretty}
@media(max-width:760px){.usage__list{grid-template-columns:1fr}}
@media(max-width:920px){
  .prow__grid{grid-template-columns:1fr}
}

/* ── Steps ────────────────────────────────────────────── */
.steps{list-style:none;display:flex;flex-direction:column;gap:14px}
.step{display:flex;gap:14px;align-items:flex-start}
.step__n{
  flex:none;width:28px;height:28px;border-radius:50%;
  display:grid;place-items:center;margin-top:1px;
  font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700;
  color:var(--accent);border:1px solid color-mix(in oklab,var(--accent),transparent 62%);
  background:color-mix(in oklab,var(--accent),transparent 92%);
}
.step__txt{font-size:17.5px;line-height:1.95;color:var(--ink2);padding-top:1px;text-wrap:pretty}
.combo__note{
  margin-top:16px;font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.02em;
  color:var(--ext);background:color-mix(in oklab,var(--ext),transparent 90%);
  border:1px solid color-mix(in oklab,var(--ext),transparent 75%);
  border-radius:4px;padding:8px 11px;display:inline-block;
}

/* ── Pieces rail ──────────────────────────────────────── */
.pieces{margin-top:24px;padding-top:18px;border-top:1px dashed var(--line2)}
.pieces__lbl{display:block;margin-bottom:11px}
.pieces__rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px}
.pieces__rail .ctile__name{font-size:12.5px}
.pieces__rail .ctile__role{font-size:8px}

/* ── Chips ────────────────────────────────────────────── */
.chip{
  display:inline-flex;align-items:center;gap:5px;vertical-align:baseline;
  font-family:"EB Garamond",serif;font-weight:500;font-size:.97em;
  padding:0 7px;border-radius:4px;line-height:1.5;
  border:1px solid var(--line2);color:var(--ink);white-space:nowrap;
  background:var(--panel2);
}
.chip__thumb{width:15px;height:21px;border-radius:2px;background-size:cover;background-position:center;flex:none;
  box-shadow:0 1px 3px rgba(0,0,0,.5)}
.chip.type-spell{border-color:color-mix(in oklab,var(--spell),transparent 50%);background:color-mix(in oklab,var(--spell),transparent 90%)}
.chip.type-mon{border-color:color-mix(in oklab,var(--mon),transparent 50%);background:color-mix(in oklab,var(--mon),transparent 90%)}
.chip.type-ext{border-color:color-mix(in oklab,var(--ext),transparent 50%);background:color-mix(in oklab,var(--ext),transparent 90%)}
.chip.type-spell{color:#eccf7e}
.chip.type-mon{color:#bcd6e6}
.chip.type-ext{color:#e9a08f}
.chip--lg{font-size:1.06em;padding:5px 13px;font-weight:600}

/* ── End board ────────────────────────────────────────── */
.combo__end{position:sticky;top:96px}
.endboard{
  background:
    radial-gradient(130% 60% at 50% 0%, color-mix(in oklab,var(--accent),transparent 90%), transparent 60%),
    linear-gradient(180deg,var(--panel2),var(--bg2));
  border:1px solid var(--line2);border-radius:10px;padding:20px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03),var(--shadow);
}
.endboard__head{display:flex;align-items:center;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:14px}
.endboard__count{display:flex;flex-direction:column;align-items:center;line-height:1}
.endboard__num{
  font-family:"Cinzel",serif;font-weight:700;font-size:54px;color:var(--accent);
  text-shadow:0 0 28px color-mix(in oklab,var(--accent),transparent 55%);
}
.endboard__unit{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-top:3px}
.endboard__title{display:flex;flex-direction:column;gap:5px}
.endboard__shared{font-size:13px;color:var(--mut);font-style:italic;line-height:1.3}
.endboard__list{list-style:none;display:flex;flex-direction:column;gap:9px}
.dis{display:flex;align-items:center;gap:11px;padding:7px 0;border-bottom:1px solid color-mix(in oklab,var(--line),transparent 35%)}
.dis:last-child{border-bottom:none}
.dis__glyph{
  flex:none;width:30px;height:30px;border-radius:6px;display:grid;place-items:center;
  font-size:16px;border:1px solid var(--line2);background:var(--bg2);color:var(--ink);
}
.dis__glyph.k-negate,.dis__glyph.k-ssnegate{color:var(--mon);border-color:color-mix(in oklab,var(--mon),transparent 55%)}
.dis__glyph.k-banish,.dis__glyph.k-removal{color:var(--ext);border-color:color-mix(in oklab,var(--ext),transparent 55%)}
.dis__glyph.k-fusion,.dis__glyph.k-boss,.dis__glyph.k-revival{color:var(--accent);border-color:color-mix(in oklab,var(--accent),transparent 55%)}
.dis__glyph.k-setup{color:var(--mut)}
.dis__body{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.dis__kind{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.14em;color:var(--mut)}
.dis__text{font-size:14.5px;color:var(--ink2);line-height:1.25}
.dis__card{font-size:13px;text-align:right;flex:none;max-width:108px;line-height:1.2}
.dis__card.type-spell{color:#eccf7e}
.dis__card.type-mon{color:#bcd6e6}
.dis__card.type-ext{color:#e9a08f}

/* ── Final board (playmat) ────────────────────────────── */
.board{
  margin-top:26px;padding-top:22px;border-top:1px solid var(--line);
}
.board__head{display:flex;align-items:baseline;gap:12px;margin-bottom:18px}
.board__kicker{
  font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--accent);
}
.board__tag{
  font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.1em;
  color:var(--mut);border:1px solid var(--line2);border-radius:3px;padding:2px 7px;
}
.board__phases{display:flex;flex-direction:column;gap:24px}
.pboard__lbl{
  display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:11px;
  font-family:"Cinzel",serif;font-weight:600;font-size:12.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink);
}
.ptag{
  font-family:"JetBrains Mono",monospace;font-size:9px;font-weight:700;letter-spacing:.04em;
  width:24px;height:20px;display:grid;place-items:center;border-radius:3px;
}
.ptag--mp{color:var(--accent);background:color-mix(in oklab,var(--accent),transparent 88%);border:1px solid color-mix(in oklab,var(--accent),transparent 62%)}
.ptag--ep{color:var(--mon);background:color-mix(in oklab,var(--mon),transparent 88%);border:1px solid color-mix(in oklab,var(--mon),transparent 60%)}
.mat{
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,.010) 0 10px, transparent 10px 20px),
    linear-gradient(180deg, #100d09, #0a0907);
  border:1px solid var(--line2);border-radius:10px;padding:16px 16px 18px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
  max-width:580px;margin:0 auto;
}
.mat__grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;align-items:end}
.mat__grid + .mat__grid{margin-top:7px}
.mat__grid--emz{margin-bottom:1px}
.cell{display:flex;justify-content:center;min-width:0}
.cell--blank{visibility:hidden}

.zone{
  width:100%;max-width:74px;aspect-ratio:59/86;border-radius:4px;position:relative;
  display:flex;flex-direction:column;
}
/* Empty play zones — thin outline; monsters get a faint double outline like the mat */
.zone--empty{
  border:1px solid var(--line2);background:rgba(255,255,255,.010);
  align-items:center;justify-content:center;
}
.zone--mon.zone--empty{box-shadow:inset 0 0 0 3px rgba(0,0,0,.5), inset 0 0 0 4px color-mix(in oklab,var(--line2),transparent 35%)}
.zone--emz.zone--empty{border-style:dashed;border-color:color-mix(in oklab,var(--accent),transparent 55%);background:color-mix(in oklab,var(--accent),transparent 93%)}
.zone__sys{
  font-family:"JetBrains Mono",monospace;font-size:8px;letter-spacing:.14em;
  color:var(--mut);text-transform:uppercase;
}
/* System zones */
.zone--sys{align-items:center;justify-content:center;gap:3px}
.zone--corner{
  border:none;background:rgba(255,255,255,.008);
  background-image:
    linear-gradient(var(--line2),var(--line2)),linear-gradient(var(--line2),var(--line2)),
    linear-gradient(var(--line2),var(--line2)),linear-gradient(var(--line2),var(--line2)),
    linear-gradient(var(--line2),var(--line2)),linear-gradient(var(--line2),var(--line2)),
    linear-gradient(var(--line2),var(--line2)),linear-gradient(var(--line2),var(--line2));
  background-repeat:no-repeat;
  background-size:11px 1px,1px 11px,11px 1px,1px 11px,11px 1px,1px 11px,11px 1px,1px 11px;
  background-position:0 0,0 0,100% 0,100% 0,0 100%,0 100%,100% 100%,100% 100%;
}
.zone--solid{border:1px solid var(--line2);background:rgba(255,255,255,.012)}
.zone--solid .zone__count{
  font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:700;color:var(--accent);
}
/* Filled play zones */
.zone--filled{border:1px solid var(--line2);box-shadow:0 6px 16px -8px rgba(0,0,0,.85)}
.zone--filled.type-spell{box-shadow:0 0 0 1px color-mix(in oklab,var(--spell),transparent 55%),0 6px 16px -8px rgba(0,0,0,.85)}
.zone--filled.type-mon{box-shadow:0 0 0 1px color-mix(in oklab,var(--mon),transparent 55%),0 6px 16px -8px rgba(0,0,0,.85)}
.zone--filled.type-ext{box-shadow:0 0 0 1px color-mix(in oklab,var(--ext),transparent 50%),0 6px 16px -8px rgba(0,0,0,.85)}
.zone--emz.zone--filled{box-shadow:0 0 0 1px color-mix(in oklab,var(--accent),transparent 45%),0 6px 16px -8px rgba(0,0,0,.85)}
.zcard{
  flex:1;border-radius:3px 3px 0 0;background-size:cover;background-position:center;
  background-color:var(--bg2);display:grid;place-items:center;overflow:hidden;
  border-bottom:1px solid var(--line);
}
.zcard__name{font-size:9px;line-height:1.14;color:var(--ink);text-align:center;padding:3px;font-weight:500}
.zcard--back{
  background:
    repeating-linear-gradient(45deg, color-mix(in oklab,var(--accent),transparent 84%) 0 6px, transparent 6px 12px),
    linear-gradient(180deg, #241a0c, #1a1308);
}
.zcard__back{color:color-mix(in oklab,var(--accent),transparent 30%);font-size:16px}
/* Set (face-down) cards — revealed, with a SET marker + dashed frame */
.zone--filled.is-set{border-style:dashed;border-color:color-mix(in oklab,var(--accent),transparent 45%)}
.is-set .zcard{position:relative}
.is-set .zcard::before{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:repeating-linear-gradient(45deg, color-mix(in oklab,var(--accent),transparent 86%) 0 6px, transparent 6px 12px);
}
.zcard__set{
  position:absolute;bottom:5px;left:50%;transform:translateX(-50%);z-index:2;
  font-family:"JetBrains Mono",monospace;font-size:7.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent);background:rgba(10,8,5,.86);
  border:1px solid color-mix(in oklab,var(--accent),transparent 55%);border-radius:2px;padding:1px 6px;
}
.zone__note{
  position:absolute;top:3px;left:3px;
  font-family:"JetBrains Mono",monospace;font-size:7px;letter-spacing:.03em;
  text-transform:uppercase;color:var(--bg);background:var(--accent);
  border-radius:2px;padding:1px 4px;font-weight:700;z-index:2;
}
.zone--filled.type-mon .zone__note{background:var(--mon)}
.zone--filled.type-ext .zone__note{background:var(--ext);color:#1a0f0c}
.zone__name{
  font-size:8.5px;line-height:1.1;color:var(--ink2);text-align:center;
  padding:3px 2px;background:rgba(0,0,0,.3);border-radius:0 0 3px 3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.zone.is-def::after{
  content:"DEF";position:absolute;bottom:17px;right:3px;z-index:2;
  font-family:"JetBrains Mono",monospace;font-size:6.5px;color:var(--ink2);
  background:rgba(0,0,0,.5);border-radius:2px;padding:0 2px;
}
.board__piles{display:flex;flex-wrap:wrap;gap:20px;margin-top:16px}
.pile{flex:1;min-width:240px}
.pile__lbl{
  font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--mut);display:block;margin-bottom:8px;
}
.pile__n{color:var(--accent);margin-left:3px}
.pile__chips{display:flex;flex-wrap:wrap;gap:6px}
.pile__empty{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--mut);font-style:italic;opacity:.7}
/* Hand pile — given its own full-width band so the "after this phase" hand reads clearly */
.pile--hand{flex-basis:100%;background:color-mix(in oklab,var(--accent),transparent 94%);
  border:1px solid color-mix(in oklab,var(--accent),transparent 80%);border-radius:6px;padding:11px 13px}
.pile--hand .pile__lbl{color:var(--accent)}
.board__lock{
  margin-top:14px;font-family:"JetBrains Mono",monospace;font-size:11.5px;
  color:var(--mon);background:color-mix(in oklab,var(--mon),transparent 90%);
  border:1px solid color-mix(in oklab,var(--mon),transparent 70%);
  border-radius:4px;padding:8px 11px;
}

/* ── Footer ───────────────────────────────────────────── */
.foot{
  margin-top:64px;padding-top:24px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:12px;color:var(--mut);font-size:13.5px;font-style:italic;
}
.foot span:first-child{color:var(--accent);font-style:normal}

/* ── Density ──────────────────────────────────────────── */
body[data-density="compact"] .combo{padding:20px 22px 22px;margin-top:14px}
body[data-density="compact"] .steps{gap:10px}
body[data-density="compact"] .combo__blurb{margin:8px 0 14px}
body[data-density="compact"] .synopsis{padding:38px 0 30px}

/* ── Responsive ───────────────────────────────────────── */
@media(max-width:880px){
  .combo__grid{grid-template-columns:1fr}
  .combo__end{position:static}
  .masthead__nav{display:none}
  .synopsis__lead{font-size:23px}
}
</style>
</head>
